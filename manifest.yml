name: RhinoGuire
version: 0.1.0
authors:
  - Aksel Alvarez
description: >
  RhinoGuire is a collection of Python 3 tools for Rhino 8 covering object
  metadata management, footprint area calculation, live-field tagging,
  data visualization, mesh-on-terrain projection, terrain grading
  (cut/fill earthwork), and road draping. Aimed at architects and landscape
  architects working with BIM data in Rhino.
url: https://github.com/No-No-Space/RhinoGuire
keywords:
  - rhinoguire
  - python
  - bim
  - data
  - mesh
  - terrain
  - grading
  - cut-fill
  - earthwork
  - road
rhino: ">=8.0"

